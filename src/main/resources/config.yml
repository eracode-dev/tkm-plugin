# ================================
#  TKM - Taş Kağıt Makas Config
#  CoinFlip tarzı oyun sistemi
# ================================

# Oyun ön eki
prefix: "&8[&eTKM&8] "

# Bahis limitleri
min-bet: 1000.0
max-bet: 10000000.0

# GUI'de gözükecek hazır miktarlar (7 taneye kadar önerilir)
amounts:
  - 1000
  - 5000
  - 10000
  - 50000
  - 100000
  - 500000
  - 1000000

# Taş/kağıt/makas seçim süresi (saniye) - sen 30 istedin
choice-time: 30

# Süre bitince seçim yapmayan KAYBEDER (true).
# false yaparsan süre bitince oyun iptal olup paralar iade edilir.
timeout-lose: true

# Beraberlik durumu:
# REMATCH = tekrar seçim istenir (önerilen)
# REFUND = paralar iade edilir
draw-action: REMATCH

# Kazananın aldığı paradan kesilecek vergi (%) - 10 = %10 kesinti
# Örn: 10.000'lik oyunda pot 20.000, kazanan 18.000 alır (2.000 vergi)
tax-percent: 10.0

# Oyun kurulunca / katılınca tüm sunucuya duyuru atılsın mı?
broadcast-create: true
broadcast-join: false
broadcast-win: true

# Chat'ten yazarak seçim yapılabilsin mi? (taş / kağıt / makas yazınca)
# true = hem tıklanabilir mesaj hem chat yazısı çalışır
allow-chat-choice: true

# GUI başlıkları (renk kodları & ile)
gui:
  main-title: "&8» &eTaş Kağıt Makas"
  games-title: "&8» &eAktif Oyunlar"

